name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Nightly rebuild picks up new or updated repos tagged `portfolio`.
  schedule:
    - cron: '0 9 * * *'
  # "Run workflow" button in the Actions tab.
  workflow_dispatch:
  # Lets other repos trigger a rebuild (see README).
  repository_dispatch:
    types: [rebuild]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v4
        with:
          node-version: 24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
